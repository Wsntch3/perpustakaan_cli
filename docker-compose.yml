services:
  postgres:
    image: postgres:16-alpine
    container_name: library-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-db_library}
      POSTGRES_USER: ${POSTGRES_USER:-library}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD belum diatur di .env}
    ports:
      # Hanya bisa diakses dari komputer ini, tidak dari jaringan luar.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - data-perpustakaan:/var/lib/postgresql/data

volumes:
  data-perpustakaan:
